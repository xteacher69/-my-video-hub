<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            padding-bottom: 50px;
        }

        header {
            background-color: #1a1a1a;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ff0000;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: #fff;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .player-container {
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 25px;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-details {
            padding: 15px;
            background-color: #181818;
        }

        .video-title {
            font-size: 18px;
            margin-bottom: 6px;
        }

        .video-desc {
            color: #aaa;
            font-size: 13px;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }

        .video-card {
            background-color: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .video-card:hover {
            transform: translateY(-4px);
            background-color: #252525;
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #333;
        }

        .thumbnail-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 10px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-author {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">▶ <span>VideoHub</span></a>
    </header>

    <div class="container">
        <div class="player-container">
            <div class="video-wrapper">
                <iframe id="mainPlayer" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen allow="autoplay"></iframe>
            </div>
            <div class="video-details">
                <h1 class="video-title" id="currentTitle">Select a video to play</h1>
                <p class="video-desc" id="currentDesc">Watch your favorite videos here.</p>
            </div>
        </div>

        <h2 class="section-title">Recommended Videos</h2>
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <script>
        const videos = [
            {
                id: "dQw4w9WgXcQ",
                title: "Never Gonna Give You Up",
                channel: "Music Channel",
                desc: "Classic global hit video."
            },
            {
                id: "M7lc1UVf-VE",
                title: "YouTube Developers Live - Overview",
                channel: "Tech Hub",
                desc: "Introduction to video applications."
            },
            {
                id: "ScMzIvxBSi4",
                title: "Relaxing Nature & Scenic Views 4K",
                channel: "Nature World",
                desc: "Calm and peaceful nature scenes."
            },
            {
                id: "kJQP7kiw5Fk",
                title: "Luis Fonsi - Despacito",
                channel: "Latin Music",
                desc: "Global music video hit."
            }
        ];

        const grid = document.getElementById("videoGrid");
        const player = document.getElementById("mainPlayer");
        const titleEl = document.getElementById("currentTitle");
        const descEl = document.getElementById("currentDesc");

        function setVideo(video) {
            player.src = `https://www.youtube.com/embed/${video.id}?autoplay=1`;
            titleEl.textContent = video.title;
            descEl.textContent = video.desc;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        videos.forEach((vid, index) => {
            if (index === 0) setVideo(vid);

            const card = document.createElement("div");
            card.className = "video-card";
            card.innerHTML = `
                <div class="thumbnail-box">
                    <img src="https://img.youtube.com/vi/${vid.id}/hqdefault.jpg" alt="${vid.title}">
                </div>
                <div class="card-info">
                    <div class="card-title">${vid.title}</div>
                    <div class="card-author">${vid.channel}</div>
                </div>
            `;
            card.onclick = () => setVideo(vid);
            grid.appendChild(card);
        });
    </script>
</body>
</html>
